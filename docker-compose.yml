services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: discord-clone-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/discord_clone
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: http://localhost:5173
      PORT: 3000
    ports:
      - '3000:3000'
    volumes:
      - api-uploads:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_SOCKET_URL: http://localhost:3000
    container_name: discord-clone-web
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - api

  # SFU for voice/video when VOICE_TRANSPORT=livekit (docs/features/voice-sfu.md). `--dev` enables
  # the embedded TURN and requires LIVEKIT_API_KEY/LIVEKIT_API_SECRET in .env. The UDP range avoids
  # 50001, which is taken on the dev machine; production needs a public IP and a wider range.
  livekit:
    image: livekit/livekit-server:v1.13.7
    container_name: discord-clone-livekit
    restart: unless-stopped
    command: ['--dev', '--bind', '0.0.0.0']
    environment:
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}'
      LIVEKIT_CONFIG: |
        rtc:
          port_range_start: 50200
          port_range_end: 50300
          use_external_ip: false
    ports:
      - '7880:7880'
      - '7881:7881'
      - '50200-50300:50200-50300/udp'

  redis:
    image: redis:7.4-alpine
    container_name: discord-clone-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'no', '--save', '']
    ports:
      - '56379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: discord-clone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: discord_clone
    ports:
      - '55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d discord_clone']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  api-uploads:
